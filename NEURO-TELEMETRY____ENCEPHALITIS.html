<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090A0D" />
  <title>NEURO-TELEMETRY // ENCEPHALITIS</title>

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            void: '#090A0D',
            panel: 'rgba(14, 16, 21, 0.9)',
            borderline: '#22262E',
            primary: '#E4E7EC',
            secondary: '#7A8291',
            normal: '#00E5A0',
            warning: '#FFB020',
            pathology: '#FF3B30',
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          borderRadius: {
            brutal: '2px',
          },
        },
      },
    };
  </script>

  <!-- GSAP для плавных перелётов камеры, интерполяции графиков и микро-анимаций HUD -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- Import Map для Three.js ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <style>
    /* Базовые настройки Clinical Brutalism и адаптация под iPhone Safari */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #090A0D;
      color: #E4E7EC;
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Полноэкранный WebGL Canvas без системных скроллов при касании */
    #neuro-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      z-index: 1;
    }

    /* Тонкая техническая сетка на фоне */
    .telemetry-grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-image:
        linear-gradient(to right, rgba(34, 38, 46, 0.22) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 38, 46, 0.22) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
      -webkit-mask-image: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
    }

    /* Панели Clinical Brutalism */
    .brutal-panel {
      background: rgba(14, 16, 21, 0.9);
      border: 1px solid #22262E;
      border-radius: 2px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* Тонкий технический скроллбар внутри информационной панели */
    .brutal-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #2E3440 rgba(9, 10, 13, 0.6);
    }
    .brutal-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .brutal-scroll::-webkit-scrollbar-track {
      background: rgba(9, 10, 13, 0.6);
    }
    .brutal-scroll::-webkit-scrollbar-thumb {
      background: #2E3440;
      border-radius: 1px;
    }

    /* Кастомный бруталистичный ползунок для Сцены 05 */
    input[type='range'].brutal-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 22px;
      background: transparent;
      cursor: pointer;
      margin: 0;
    }
    input[type='range'].brutal-range:focus {
      outline: none;
    }
    input[type='range'].brutal-range::-webkit-slider-runnable-track {
      height: 6px;
      background: #141821;
      border: 1px solid #2E3440;
      border-radius: 1px;
    }
    input[type='range'].brutal-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 20px;
      background: #FF3B30;
      border: 1px solid #E4E7EC;
      border-radius: 1px;
      margin-top: -8px;
    }
    input[type='range'].brutal-range::-moz-range-track {
      height: 6px;
      background: #141821;
      border: 1px solid #2E3440;
      border-radius: 1px;
    }
    input[type='range'].brutal-range::-moz-range-thumb {
      width: 14px;
      height: 20px;
      background: #FF3B30;
      border: 1px solid #E4E7EC;
      border-radius: 1px;
    }

    /* Безопасные отступы iPhone Notch / Dynamic Island / Home Indicator */
    .safe-top {
      padding-top: max(0.625rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(0.625rem, env(safe-area-inset-bottom));
    }
    .safe-x {
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
    }

    /* Пульсация системного индикатора */
    @keyframes telemetryBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.32; }
    }
    .status-pulse {
      animation: telemetryBlink 2.2s infinite ease-in-out;
    }

    /* Тревожное мигание при коме (GCS 3–8) и вклинении */
    @keyframes comaAlertBlink {
      0%, 100% { opacity: 1; background-color: rgba(255, 59, 48, 0.22); }
      50% { opacity: 0.45; background-color: rgba(255, 59, 48, 0.06); }
    }
    .coma-blink {
      animation: comaAlertBlink 0.9s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-void text-primary antialiased">
  <!-- 3D WebGL Viewport -->
  <canvas id="neuro-canvas" aria-label="Интерактивная 3D-модель головного мозга"></canvas>

  <!-- Периферийная координатная сетка -->
  <div class="telemetry-grid-overlay" aria-hidden="true"></div>

  <!-- Прицельные угловые маркеры центрального вьюпорта -->
  <div class="pointer-events-none fixed inset-0 z-[3] flex items-center justify-center" aria-hidden="true">
    <div class="relative h-[58vw] w-[58vw] max-h-[420px] max-w-[420px] opacity-35">
      <span class="absolute left-0 top-0 h-3 w-3 border-l border-t border-[#7A8291]"></span>
      <span class="absolute right-0 top-0 h-3 w-3 border-r border-t border-[#7A8291]"></span>
      <span class="absolute bottom-0 left-0 h-3 w-3 border-b border-l border-[#7A8291]"></span>
      <span class="absolute bottom-0 right-0 h-3 w-3 border-b border-r border-[#7A8291]"></span>
    </div>
  </div>

  <!-- Слой интерфейса (HUD) -->
  <div class="pointer-events-none fixed inset-0 z-10 flex flex-col justify-between safe-top safe-bottom safe-x">
    
    <!-- 1. ВЕРХНИЙ HUD-БАР -->
    <header class="pointer-events-auto w-full">
      <div class="brutal-panel flex flex-wrap items-center justify-between gap-2 px-3 py-2 sm:px-4 sm:py-2.5">
        
        <!-- Идентификатор терминала -->
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="flex h-7 w-7 shrink-0 items-center justify-center border border-[#22262E] bg-[#090A0D] rounded-[2px]">
            <svg class="h-4 w-4 text-normal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M12 3C7.5 3 4 6.2 4 10.5C4 13.4 5.7 15.8 8.2 17L8.5 21H13.5V17.5C17.2 17 20 14.1 20 10.5C20 6.2 16.5 3 12 3Z" />
              <line x1="12" y1="3" x2="12" y2="14" stroke-dasharray="2 2" />
            </svg>
          </div>
          <div class="min-w-0">
            <h1 class="font-display text-xs sm:text-sm font-bold tracking-[0.08em] text-primary truncate">
              NEURO-TELEMETRY // ENCEPHALITIS
            </h1>
            <p class="font-mono text-[10px] tracking-[0.06em] text-secondary truncate">
              UNIT: NEURO-ICU-01 // 3D CORTICAL &amp; BRAINSTEM CORE
            </p>
          </div>
        </div>

        <!-- Правый блок телеметрии: Зрачки + Статус -->
        <div class="flex items-center gap-2 sm:gap-3 ml-auto">
          
          <!-- Живой индикатор зрачков (OD / OS) -->
          <div
            class="flex items-center gap-2 border border-[#22262E] bg-[#090A0D] px-2.5 py-1 rounded-[2px]"
            title="Пупиллометрия: правый (OD) и левый (OS) зрачки"
          >
            <div class="flex items-center gap-1.5" aria-hidden="true">
              <svg class="h-3.5 w-3.5" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="6.5" fill="none" stroke="#7A8291" stroke-width="1" />
                <circle id="pupil-od-svg" cx="8" cy="8" r="2.7" fill="#00E5A0" />
              </svg>
              <svg class="h-3.5 w-3.5" viewBox="0 0 16 16">
                <circle cx="8" cy="8" r="6.5" fill="none" stroke="#7A8291" stroke-width="1" />

            </div>
            <span id="pupils-readout" class="font-mono text-[11px] sm:text-xs font-medium tracking-tight text-primary">
              OD <span id="od-val" class="text-normal">3.0</span>mm / OS <span id="os-val" class="text-normal">3.0</span>mm
            </span>
          </div>

          <!-- Статус системы -->
          <div id="system-status-box" class="flex items-center gap-2 border border-[#22262E] bg-[#090A0D] px-2.5 py-1 rounded-[2px]">
            <span id="status-dot" class="status-pulse inline-block h-2 w-2 bg-normal rounded-[1px]"></span>
            <span id="system-status-text" class="font-mono text-[11px] sm:text-xs font-semibold tracking-[0.06em] text-normal">
              SYSTEM READY
            </span>
          </div>
        </div>
      </div>

      <!-- Вспомогательная мини-строка управления камерой и координат -->
      <div class="mt-1.5 flex items-center justify-between gap-2">
        <div class="brutal-panel pointer-events-auto inline-flex items-center gap-2 px-2.5 py-1 font-mono text-[10px] text-secondary">
          <span>PTS: <strong class="text-primary font-medium">3,500</strong></span>
          <span class="text-[#22262E]">|</span>
          <span>BBB-MESH: <strong id="bbb-status-label" class="text-normal font-medium">ACTIVE</strong></span>
          <span class="hidden sm:inline text-[#22262E]">|</span>
          <span id="camera-angles" class="hidden sm:inline">AZ: +032° EL: +018°</span>
        </div>

        <div class="pointer-events-auto flex items-center gap-1.5">
          <button
            id="btn-autorotate"
            type="button"
            class="brutal-panel px-2.5 py-1 font-mono text-[10px] tracking-wider text-secondary hover:text-primary hover:border-[#3A414E] transition-colors active:scale-[0.99]"
          >
            AUTO-SCAN: <span id="autorotate-state" class="text-normal">ON</span>
          </button>
          <button
            id="btn-reset-view"
            type="button"
            class="brutal-panel px-2.5 py-1 font-mono text-[10px] tracking-wider text-secondary hover:text-primary hover:border-[#3A414E] transition-colors active:scale-[0.99]"
          >
            [СБРОС РАКУРСА]
          </button>
        </div>
      </div>
    </header>

    <!-- 2. НИЖНИЙ БЛОК: МОДЕРНИЗИРОВАННАЯ ИНФОРМАЦИОННАЯ ПАНЕЛЬ + НАВИГАЦИЯ ПО 6 МОДУЛЯМ -->
    <footer class="pointer-events-auto w-full flex flex-col gap-2">
      
      <!-- Адаптивная информационная панель активной сцены -->
      <div class="w-full sm:max-w-xl">

          <!-- Динамическое тело активной сцены -->
          <div id="scene-panel-body" class="px-3.5 py-2.5"></div>
        </div>
      </div>

      <!-- Панель навигации по 6 сценам -->
      <nav aria-label="Навигация по клиническим модулям" class="w-full">
        <div
          id="scene-nav-bar"
          class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-1.5"
        >
          <button
            type="button"
            data-scene="0"

          <button

            class="scene-btn brutal-panel min-h-[42px] px-2.5 py-2 text-left font-mono text-[11px] font-medium tracking-[0.03em] text-primary hover:border-[#3E4554] transition-colors flex items-center justify-between"

          </button>
        </div>
      </nav>
    </footer>
  </div>

    /**
     * Детерминированный генератор псевдослучайных чисел для воспроизводимой анатомии
     */
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    /**
     * Вычисление анатомической координаты точки коры полушария мозга
     */
    function evaluateHemispherePoint(side, theta, phi, radialScale = 1.0) {
      let nx = Math.sin(phi) * Math.cos(theta);
      let ny = Math.cos(phi);
      let nz = Math.sin(phi) * Math.sin(theta);

      let medialFactor = Math.abs(nx);
      let latX = Math.pow(medialFactor, 0.78);

      let x = side * (0.095 + latX * 1.12);
      let y = ny * 1.38;
      let z = nz * 2.28;

      const zNorm = nz;
      const poleTaper = 1.0 - 0.22 * Math.pow(zNorm, 2);
      x = side * (0.09 + (Math.abs(x) - 0.09) * poleTaper);

      if (zNorm < -0.1 && ny < 0.15) {
        const occipitalLift = Math.pow(Math.max(0, -zNorm - 0.1), 1.35) * Math.max(0, 0.25 - ny);
        y += occipitalLift * 1.15;
      }

      const temporalMask =
        Math.exp(-Math.pow((zNorm - 0.12) / 0.48, 2)) *
        Math.exp(-Math.pow((ny + 0.38) / 0.36, 2));
      const latMask = Math.min(1, Math.max(0, (latX - 0.25) / 0.55));
      const tWeight = temporalMask * latMask;
      x += side * (0.24 * tWeight);
      y -= 0.34 * tWeight;
      z += 0.16 * tWeight;

      const sylvianMask =
        Math.exp(-Math.pow((zNorm - 0.18) / 0.52, 2)) *
        Math.exp(-Math.pow((ny + 0.06) / 0.12, 2)) *
        latMask;
      x -= side * (0.16 * sylvianMask);
      y -= 0.06 * sylvianMask;

      const g1 = Math.sin(x * 7.8 + Math.cos(z * 6.4) * 1.4) * Math.cos(y * 7.6 + Math.sin(x * 5.9) * 1.3);
      const g2 = Math.sin(z * 11.2 - y * 9.5 + x * 6.1) * 0.5;
      const gyrusHeight = g1 * 0.058 + g2 * 0.028;

      const cx = side * 0.095;
      x = cx + (x - cx) * radialScale + side * latX * gyrusHeight;
      y = y * radialScale + ny * gyrusHeight;
      z = z * radialScale + nz * gyrusHeight;

      if (side > 0 && x < 0.085) x = 0.085;
      if (side < 0 && x > -0.085) x = -0.085;

      return { x, y, z, gyrusHeight, latX, zNorm, ny };
    }

      const rand = mulberry32(20261117);

      const colorGyrusBright = new THREE.Color('#E4E7EC');
      const colorCortexCyan = new THREE.Color('#6CC4FF');
      const colorNormalAccent = new THREE.Color('#00E5A0');
      const colorSulcusDim = new THREE.Color('#2A3649');

      let idx = 0;

      for (let h = 0; h < 2; h++) {
        const side = h === 0 ? -1 : 1;

        for (let i = 0; i < perHemisphere; i++) {
          const u = (i + 0.5) / perHemisphere;
          const phi = Math.acos(1 - 2 * u) + (rand() - 0.5) * 0.04;
          const theta = Math.PI * (1 + Math.sqrt(5)) * i + (rand() - 0.5) * 0.08;

          const isSubcortical = rand() < 0.18;
          const radialScale = isSubcortical ? 0.68 + rand() * 0.24 : 0.985 + rand() * 0.025;

          const pt = evaluateHemispherePoint(side, theta, phi, radialScale);

          positions[idx * 3] = pt.x;
          positions[idx * 3 + 1] = pt.y;
          positions[idx * 3 + 2] = pt.z;

          const crestFactor = THREE.MathUtils.clamp((pt.gyrusHeight + 0.07) / 0.14, 0, 1);
          const tempColor = new THREE.Color();

          if (isSubcortical) {
            tempColor.copy(colorSulcusDim).lerp(colorCortexCyan, 0.35);
          } else if (crestFactor > 0.72) {
            tempColor.copy(colorCortexCyan).lerp(colorGyrusBright, (crestFactor - 0.72) / 0.28);
            if (rand() < 0.14) {
              tempColor.lerp(colorNormalAccent, 0.65);
            }
          } else {
            tempColor.copy(colorSulcusDim).lerp(colorCortexCyan, crestFactor * 0.95);
          }

          colors[idx * 3] = tempColor.r;
          colors[idx * 3 + 1] = tempColor.g;
          colors[idx * 3 + 2] = tempColor.b;

          sizes[idx] = isSubcortical ? 1.55 : 1.9 + crestFactor * 1.15;
          phases[idx] = rand() * Math.PI * 2;

          const isTemporal = pt.zNorm > -0.35 && pt.zNorm < 0.62 && pt.ny < 0.02 && pt.latX > 0.38;
          regionFlags[idx] = isTemporal ? 1.0 : 0.0;

          const isDeepLimbic = isSubcortical && Math.abs(pt.z) < 1.15 && Math.abs(pt.y) < 0.75;
          subcorticalFlags[idx] = isDeepLimbic ? 1.0 : 0.0;

          idx++;
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
      geometry.setAttribute('aRegion', new THREE.BufferAttribute(regionFlags, 1));
      geometry.setAttribute('aSubcortical', new THREE.BufferAttribute(subcorticalFlags, 1));

      hemispheresMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
          uTemporalHighlight: { value: 0.0 },
          uSubcorticalHighlight: { value: 0.0 },
          uSeverity: { value: 0.0 },
          uEdema: { value: 0.0 },
        },
        vertexShader: `
          attribute float aSize;
          attribute float aPhase;
          attribute float aRegion;
          attribute float aSubcortical;
          varying vec3 vColor;
          varying float vAlpha;
          varying float vRegion;
          varying float vSubcortical;
          uniform float uTime;
          uniform float uPixelRatio;
          uniform float uSeverity;
          uniform float uEdema;

          void main() {
            vColor = color;
            vRegion = aRegion;
            vSubcortical = aSubcortical;

            float distress = max(uSeverity, uEdema);
            float pulseFreq = 2.1 + distress * 4.8;
            float pulseAmp = 0.011 + distress * 0.032;
            float pulseWave = sin(uTime * pulseFreq - position.y * 1.85 + aPhase * 0.35);

            float edemaSwelling = 1.0 + uEdema * 0.135;
            float radialPulse = edemaSwelling + pulseWave * pulseAmp;
            vec3 animatedPos = position * radialPulse;

            animatedPos.y -= uEdema * 0.34;
            animatedPos.x *= (1.0 - uEdema * 0.045 * smoothstep(0.4, -1.2, position.y));

            vec4 mvPosition = modelViewMatrix * vec4(animatedPos, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            float twinkleFreq = 2.8 + distress * 4.2;
            float twinkle = 0.88 + (0.16 + distress * 0.16) * sin(uTime * twinkleFreq + aPhase);
            float sizeBoost = 1.0 + uEdema * 0.22;
            gl_PointSize = aSize * sizeBoost * uPixelRatio * twinkle * (14.5 / max(1.5, -mvPosition.z));
            vAlpha = clamp(0.62 + 0.32 * twinkle, 0.45, 0.98);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;
          varying float vRegion;
          varying float vSubcortical;
          uniform float uTemporalHighlight;
          uniform float uSubcorticalHighlight;
          uniform float uSeverity;
          uniform float uEdema;

          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;

            float core = smoothstep(0.5, 0.22, dist);
            vec3 finalColor = vColor;

            if (vRegion > 0.5 && uTemporalHighlight > 0.01) {
              finalColor = mix(finalColor, vec3(1.0, 0.231, 0.188), uTemporalHighlight * 0.78);
            }

            if (vSubcortical > 0.5 && uSubcorticalHighlight > 0.01) {
              finalColor = mix(finalColor, vec3(0.0, 0.898, 0.627), uSubcorticalHighlight * 0.92);
            }

            if (uSeverity > 0.01) {
              finalColor = mix(finalColor, vec3(1.0, 0.231, 0.188), uSeverity * 0.38);
            }

            if (uEdema > 0.01) {
              finalColor = mix(finalColor, vec3(1.0, 0.231, 0.188), uEdema * 0.72);
            }

            gl_FragColor = vec4(finalColor, vAlpha * core);
          }
        `,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
      });

      hemispheresPoints = new THREE.Points(geometry, hemispheresMaterial);
      brainRootGroup.add(hemispheresPoints);
    }

    /**
     * Создание ствола мозга в основании
     */
    function createBrainstem() {
      brainstemGroup = new THREE.Group();

      const radialSegs = 22;
      const heightSegs = 28;
      const stemGeo = new THREE.CylinderGeometry(0.32, 0.21, 1.65, radialSegs, heightSegs, false);
      const posAttr = stemGeo.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        let x = posAttr.getX(i);
        let y = posAttr.getY(i);
        let z = posAttr.getZ(i);

        const t = (y + 0.825) / 1.65;
        const ponsBulge = Math.exp(-Math.pow((t - 0.62) / 0.16, 2));
        const basilarGroove = z > 0 ? Math.exp(-Math.pow(x / 0.09, 2)) * 0.04 * ponsBulge : 0;
        const peduncleSpread = Math.max(0, (t - 0.8) / 0.2);

        x *= 1.0 + ponsBulge * 0.38 + peduncleSpread * 0.28;
        z *= 1.0 + ponsBulge * 0.45;
        if (z > 0) {
          z += ponsBulge * 0.16 - basilarGroove;
        }

        const tiltZ = -0.22 - (1.0 - t) * 0.28;
        posAttr.setXYZ(i, x, y - 1.22, z + tiltZ);
      }

      stemGeo.computeVertexNormals();

      const coreMat = new THREE.MeshBasicMaterial({
        color: '#111927',
        transparent: true,
        opacity: 0.72,
      });
      brainstemGroup.add(new THREE.Mesh(stemGeo, coreMat));

      brainstemWireMaterial = new THREE.MeshBasicMaterial({
        color: '#3A7BD5',
        wireframe: true,
        transparent: true,
        opacity: 0.34,
      });
      brainstemGroup.add(new THREE.Mesh(stemGeo, brainstemWireMaterial));

      const stemPointsMat = new THREE.PointsMaterial({
        color: '#6CC4FF',
        size: 0.032,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      brainstemGroup.add(new THREE.Points(stemGeo, stemPointsMat));

      brainRootGroup.add(brainstemGroup);
    }

    /**
     * Создание мозжечка сзади снизу
     */
    function createCerebellum() {
      cerebellumGroup = new THREE.Group();

      const segsU = 36;
      const segsV = 24;
      const cerebGeo = new THREE.SphereGeometry(1.0, segsU, segsV);
      const posAttr = cerebGeo.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        let nx = posAttr.getX(i);
        let ny = posAttr.getY(i);
        let nz = posAttr.getZ(i);

        const vermisNotch = 1.0 - 0.22 * Math.exp(-Math.pow(nx / 0.22, 2));
        const folia = Math.sin(ny * 34.0) * 0.022;

        let x = nx * 1.04;
        let y = ny * 0.54 * vermisNotch + folia * 0.4;
        let z = nz * 0.64 * vermisNotch + folia;

        posAttr.setXYZ(i, x, y - 1.06, z - 1.32);
      }

      cerebGeo.computeVertexNormals();

      const cerebCoreMat = new THREE.MeshBasicMaterial({
        color: '#0D131E',
        transparent: true,
        opacity: 0.7,
      });
      cerebellumGroup.add(new THREE.Mesh(cerebGeo, cerebCoreMat));

      cerebellumWireMaterial = new THREE.MeshBasicMaterial({
        color: '#4E9AF1',
        wireframe: true,
        transparent: true,
        opacity: 0.28,
      });
      cerebellumGroup.add(new THREE.Mesh(cerebGeo, cerebellumWireMaterial));

      const cerebPointsMat = new THREE.PointsMaterial({
        color: '#9AD4FF',
        size: 0.028,
        transparent: true,
        opacity: 0.68,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      cerebellumGroup.add(new THREE.Points(cerebGeo, cerebPointsMat));

      brainRootGroup.add(cerebellumGroup);
    }

    /**
     * Полупрозрачная каркасная оболочка вокруг полушарий (мозговые оболочки и ГЭБ)
     */
    function createMeningesShell() {
      meningesGroup = new THREE.Group();

      const shellGeo = new THREE.IcosahedronGeometry(1.0, 4);
      const posAttr = shellGeo.attributes.position;

      for (let i = 0; i < posAttr.count; i++) {
        const vx = posAttr.getX(i);
        const vy = posAttr.getY(i);
        const vz = posAttr.getZ(i);

        const len = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
        const nx = vx / len;
        const ny = vy / len;
        const nz = vz / len;

        let x = nx * 1.44;
        let y = ny * 1.54;
        let z = nz * 2.46;

        const taper = 1.0 - 0.18 * Math.pow(nz, 2);
        x *= taper;

        const falxIndent = Math.exp(-Math.pow(nx / 0.14, 2)) * Math.max(0, ny) * 0.11;
        y -= falxIndent;

        if (nz < -0.15 && ny < 0.1) {
          y += Math.pow(Math.max(0, -nz - 0.15), 1.3) * Math.max(0, 0.2 - ny) * 1.05;
        }

        const tempBulge =
          Math.exp(-Math.pow((nz - 0.1) / 0.52, 2)) *
          Math.exp(-Math.pow((ny + 0.35) / 0.4, 2)) *
          Math.abs(nx);
        x += Math.sign(nx) * tempBulge * 0.22;
        y -= tempBulge * 0.22;

        posAttr.setXYZ(i, x, y, z);
      }

      shellGeo.computeVertexNormals();

      const membraneMat = new THREE.MeshBasicMaterial({
        color: '#1E2A3A',
        transparent: true,
        opacity: 0.055,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      meningesGroup.add(new THREE.Mesh(shellGeo, membraneMat));

      meningesWireMaterial = new THREE.MeshBasicMaterial({
        color: '#34495E',
        wireframe: true,
        transparent: true,
        opacity: 0.17,
        depthWrite: false,
      });
      meningesGroup.add(new THREE.Mesh(shellGeo, meningesWireMaterial));

      const ringGeo = new THREE.RingGeometry(2.72, 2.735, 96);
      const ringMat = new THREE.MeshBasicMaterial({
        color: '#22262E',
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.65,
      });
      const axialRing = new THREE.Mesh(ringGeo, ringMat);
      axialRing.rotation.x = Math.PI / 2;
      axialRing.position.y = -0.35;
      meningesGroup.add(axialRing);

      brainRootGroup.add(meningesGroup);
    }

    /**
     * Создание 4 интерактивных 3D-хотспотов внутри brainRootGroup для Сцен 03, 04 и 06
     */
    function createTopicalHotspots() {
      hotspotsContainerGroup = new THREE.Group();
      hotspotsContainerGroup.visible = false;

      TOPICAL_HOTSPOTS.forEach((spot) => {
        const group = new THREE.Group();
        group.position.set(spot.coords.x, spot.coords.y, spot.coords.z);
        group.userData = { hotspotId: spot.id };

        // Светящееся ядро маркера
        const coreGeo = new THREE.SphereGeometry(0.11, 20, 20);
        const coreMat = new THREE.MeshBasicMaterial({
          color: '#00E5A0',
          transparent: true,
          opacity: 0.92,
          depthTest: false,
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.renderOrder = 20;

        // Внутреннее прицельное кольцо
        const ringGeo = new THREE.RingGeometry(0.16, 0.195, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: '#00E5A0',
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85,
          depthTest: false,
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.renderOrder = 20;

        // Внешний пульсирующий ореол
        const haloGeo = new THREE.RingGeometry(0.22, 0.24, 32);
        const haloMat = new THREE.MeshBasicMaterial({
          color: '#00E5A0',
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.45,
          depthTest: false,
        });
        const haloMesh = new THREE.Mesh(haloGeo, haloMat);
        haloMesh.renderOrder = 19;

        // Увеличенная невидимая хит-сфера для точного касания пальцем на iPhone Safari
        const hitGeo = new THREE.SphereGeometry(0.36, 14, 14);
        const hitMat = new THREE.MeshBasicMaterial({
          visible: false,
        });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        hitMesh.userData = { hotspotId: spot.id };

        group.add(coreMesh, ringMesh, haloMesh, hitMesh);
        hotspotsContainerGroup.add(group);

        hotspotObjectsMap[spot.id] = {
          group,
          coreMesh,
          ringMesh,
          haloMesh,
          hitMesh,
        };
        hotspotHitMeshes.push(hitMesh);
      });

      brainRootGroup.add(hotspotsContainerGroup);
    }

    /**
     * Инициализация Three.js сцены, камеры, рендерера, контроллеров и Raycaster
     */
    function initThree() {
      const canvas = document.getElementById('neuro-canvas');

      scene = new THREE.Scene();
      scene.background = new THREE.Color('#090A0D');
      scene.fog = new THREE.FogExp2('#090A0D', 0.045);

      const width = window.innerWidth;
      const height = window.innerHeight;

      camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
      const initialScene = SCENES_CONFIG[0];
      camera.position.set(initialScene.cameraPos.x, initialScene.cameraPos.y, initialScene.cameraPos.z);

      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height, false);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.rotateSpeed = 0.72;
      controls.zoomSpeed = 0.85;
      controls.enablePan = false;
      controls.minDistance = 2.6;
      controls.maxDistance = 9.5;
      controls.target.set(initialScene.targetPos.x, initialScene.targetPos.y, initialScene.targetPos.z);

      controls.touches = {
        ONE: THREE.TOUCH.ROTATE,
        TWO: THREE.TOUCH.DOLLY_ROTATE,
      };

      const interruptCameraFlight = () => {
        if (activeCameraTween) {
          activeCameraTween.kill();
          activeCameraTween = null;
        }
        if (activeTargetTween) {
          activeTargetTween.kill();
          activeTargetTween = null;
        }
      };

      // Защита от случайного клика по 3D-хотспоту при перетаскивании/вращении камеры
      renderer.domElement.addEventListener(
        'pointerdown',
        (e) => {
          interruptCameraFlight();
          pointerDownInfo = {
            x: e.clientX,
            y: e.clientY,
            time: performance.now(),
          };
        },
        { passive: true }
      );

      renderer.domElement.addEventListener(
        'pointerup',
        (e) => {
          if (currentSceneIndex !== 2 && currentSceneIndex !== 5) return;
          const dist = Math.hypot(e.clientX - pointerDownInfo.x, e.clientY - pointerDownInfo.y);
          const dt = performance.now() - pointerDownInfo.time;
          if (dist < 10 && dt < 450) {
            handleCanvasTapRaycast(e.clientX, e.clientY);
          }
        },
        { passive: true }
      );

      renderer.domElement.addEventListener(
        'pointermove',
        (e) => {
          if (currentSceneIndex !== 2 && currentSceneIndex !== 5) {
            renderer.domElement.style.cursor = 'grab';
            return;
          }
          if (currentSceneIndex === 5 && clinicalState.scene06.submitted) {
            renderer.domElement.style.cursor = 'grab';
            return;
          }
          const rect = renderer.domElement.getBoundingClientRect();
          pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(pointerNdc, camera);
          const hits = raycaster.intersectObjects(hotspotHitMeshes, false);
          renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'grab';
        },
        { passive: true }
      );

      renderer.domElement.addEventListener('touchstart', interruptCameraFlight, { passive: true });
      renderer.domElement.addEventListener('wheel', interruptCameraFlight, { passive: true });

      brainRootGroup = new THREE.Group();
      scene.add(brainRootGroup);

      createCerebralHemispheres();
      createBrainstem();
      createCerebellum();
      createMeningesShell();
      createTopicalHotspots();

      window.addEventListener('resize', onWindowResize, { passive: true });
      window.addEventListener('orientationchange', () => {
        setTimeout(onWindowResize, 120);
      });
    }

    /**
     * Рейкастинг по 4 3D-хотспотам в Сцене 03 и Сцене 06
     */
    function handleCanvasTapRaycast(clientX, clientY) {
      if (!hotspotsContainerGroup || !hotspotsContainerGroup.visible) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointerNdc, camera);
      const intersects = raycaster.intersectObjects(hotspotHitMeshes, false);
      if (intersects.length > 0) {
        const hitId = intersects[0].object.userData.hotspotId;
        if (!hitId) return;
        if (currentSceneIndex === 2) {
          selectTopicalHotspot(hitId);
        } else if (currentSceneIndex === 5) {
          selectSimulatorHotspot(hitId);
        }
      }
    }

    /**
     * Обновление размеров вьюпорта и перерисовка активного 2D-графика при ресайзе
     */
    function onWindowResize() {
      if (!camera || !renderer) return;
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      const dpr = Math.min(window.devicePixelRatio, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(width, height, false);

      if (hemispheresMaterial) {
        hemispheresMaterial.uniforms.uPixelRatio.value = dpr;
      }

      if (!clinicalState.panelCollapsed) {
        if (currentSceneIndex === 0) drawTempChart();
        if (currentSceneIndex === 4) drawCushingChart();
      }
    }

    /**
     * Вычисление суммарного балла ШКГ и клинического статуса
     */
    function getGcsSummary() {
      const { e, v, m } = clinicalState.scene02;
      const total = e + v + m;

      if (total === 15) {
        return {
          total,
          label: 'ЯСНОЕ СОЗНАНИЕ',
          hex: '#00E5A0',
          textClass: 'text-normal',
          borderClass: 'border-normal/50',
          bgClass: 'bg-normal/10',
          isComa: false,
        };
      }
      if (total >= 13) {
        return {
          total,
          label: 'ОГЛУШЕНИЕ',
          hex: '#FFB020',
          textClass: 'text-[#FFB020]',
          borderClass: 'border-[#FFB020]/50',
          bgClass: 'bg-[#FFB020]/10',
          isComa: false,
        };
      }
      if (total >= 9) {
        return {
          total,
          label: 'СОПОР',
          hex: '#FF3B30',
          textClass: 'text-pathology',
          borderClass: 'border-pathology/60',
          bgClass: 'bg-pathology/15',
          isComa: false,
        };
      }
      return {
        total,
        label: 'КОМА',
        hex: '#FF3B30',
        textClass: 'text-pathology',
        borderClass: 'border-pathology',
        bgClass: 'bg-pathology/20',
        isComa: true,
      };
    }

    /**
     * Расчёт показателей Триады Кушинга и ВЧД для Сцены 05
     */
    function getHerniationMetrics() {
      const pct = clinicalState.scene05.edemaIndex;
      const t = pct / 100;

      const icp = Math.round(12 + t * 36);
      const sbp = Math.round(120 + Math.pow(t, 1.15) * 95);
      const dbp = Math.round(76 + t * 34);
      const hr = Math.round(78 - Math.pow(t, 1.1) * 38);
      const rr = Math.round(16 - t * 8);

      return { pct, t, icp, sbp, dbp, hr, rr };
    }

    /**
     * Синхронизация 3D-материалов, шейдеров, хотспотов и верхнего HUD со всеми сценами (01–06)
     */
    function sync3DAndTelemetryState() {
      if (!hemispheresMaterial || !meningesWireMaterial) return;

      const gcs = getGcsSummary();
      const { nuchal, kernig, brudzinski } = clinicalState.scene02.meningeal;
      const hasMeningeal = nuchal || kernig || brudzinski;
      const herniation = getHerniationMetrics();

      // 1. Обновляем uSeverity (Сцена 02) и uEdema (Сцена 05) в шейдере полушарий
      const targetSeverity =
        gcs.total < 13 ? THREE.MathUtils.clamp((13 - gcs.total) / 10, 0.12, 1.0) : 0.0;

      const targetEdema = currentSceneIndex === 4 ? herniation.t : 0.0;

      gsap.to(hemispheresMaterial.uniforms.uSeverity, {
        value: targetSeverity,
        duration: 0.55,
        ease: 'power2.out',
      });
      gsap.to(hemispheresMaterial.uniforms.uEdema, {
        value: targetEdema,
        duration: 0.35,
        ease: 'power2.out',
      });

      if (meningesGroup) {
        gsap.to(meningesGroup.position, {
          y: -targetEdema * 0.28,
          duration: 0.35,
          ease: 'power2.out',
        });
      }

      // 2. Обновляем статус в верхнем HUD
      const sysTextEl = document.getElementById('system-status-text');
      const sysDotEl = document.getElementById('status-dot');
      if (sysTextEl && sysDotEl) {
        if (currentSceneIndex === 4 && herniation.pct > 35) {
          sysTextEl.textContent = 'HERNIATION ALERT';
          sysTextEl.className = 'font-mono text-[11px] sm:text-xs font-semibold tracking-[0.06em] text-pathology';
          sysDotEl.className = 'status-pulse inline-block h-2 w-2 bg-pathology rounded-[1px]';
        } else if (gcs.total <= 8) {
          sysTextEl.textContent = `COMA // GCS ${gcs.total}`;
          sysTextEl.className = 'font-mono text-[11px] sm:text-xs font-semibold tracking-[0.06em] text-pathology';
          sysDotEl.className = 'status-pulse inline-block h-2 w-2 bg-pathology rounded-[1px]';
        } else if (gcs.total < 13) {
          sysTextEl.textContent = `SOPOR // GCS ${gcs.total}`;
          sysTextEl.className = 'font-mono text-[11px] sm:text-xs font-semibold tracking-[0.06em] text-pathology';
          sysDotEl.className = 'status-pulse inline-block h-2 w-2 bg-pathology rounded-[1px]';
        } else if (gcs.total < 15) {
          sysTextEl.textContent = `STUN // GCS ${gcs.total}`;
          sysTextEl.className = 'font-mono text-[11px] sm:text-xs font-semibold tracking-[0.06em] text-[#FFB020]';
          sysDotEl.className = 'status-pulse inline-block h-2 w-2 bg-[#FFB020] rounded-[1px]';
        } else {
          sysTextEl.textContent = 'SYSTEM READY';
          sysTextEl.className = 'font-mono text-[11px] sm:text-xs font-semibold tracking-[0.06em] text-normal';
          sysDotEl.className = 'status-pulse inline-block h-2 w-2 bg-normal rounded-[1px]';
        }
      }

      // 3. Подсветка оболочек, полушарий, ствола и мозжечка по активной сцене
      let targetMeningesColor = '#34495E';
      let targetMeningesOpacity = 0.17;
      let targetTemporal = 0.0;
      let targetSubcortical = 0.0;
      let bbbText = 'ACTIVE';
      let bbbClass = 'text-normal font-medium';

      let stemColor = '#3A7BD5';
      let stemOpacity = 0.34;
      let stemScaleY = 1.0;

      let cerebColor = '#4E9AF1';
      let cerebOpacity = 0.28;

      if (currentSceneIndex === 0) {
        const profile = ETIOLOGY_PROFILES[clinicalState.scene01.etiology];
        targetMeningesColor = profile.bbbColor;
        targetMeningesOpacity = profile.bbbOpacity;
        if (profile.id === 'hsv1') {
          bbbText = 'INFLAMED [HSV-1]';
          bbbClass = 'text-pathology font-medium';
        } else if (profile.id === 'tbev') {
          bbbText = 'REACTIVE [TBEV]';
          bbbClass = 'text-[#FFB020] font-medium';
        } else {
          bbbText = 'INTACT [NMDA]';
          targetSubcortical = 0.55;
        }
      } else if (currentSceneIndex === 1) {
        if (hasMeningeal) {
          targetMeningesColor = '#FF3B30';
          targetMeningesOpacity = 0.46;
          bbbText = 'MENINGISM [+]';
          bbbClass = 'text-pathology font-medium';
        } else {
          targetMeningesColor = '#34495E';
          targetMeningesOpacity = 0.2;
          bbbText = 'CLEAR [–]';
        }
      } else if (currentSceneIndex === 2) {
        const spotId = clinicalState.scene03.selectedHotspot;
        bbbText = `FOCUS: ${spotId.toUpperCase()}`;
        bbbClass = 'text-pathology font-medium';
        if (spotId === 'temporal') targetTemporal = 0.75;
        if (spotId === 'basal') targetSubcortical = 0.85;
        if (spotId === 'brainstem') {
          stemColor = '#FF3B30';
          stemOpacity = 0.65;
        }
        if (spotId === 'cerebellum') {
          cerebColor = '#FF3B30';
          cerebOpacity = 0.58;
        }
      } else if (currentSceneIndex === 3) {
        const pheno = CLINICAL_PHENOTYPES[clinicalState.scene04.phenotype];
        if (pheno.id === 'hsv1') {
          targetTemporal = 1.0;
          targetMeningesColor = '#FF3B30';
          targetMeningesOpacity = 0.26;
          bbbText = 'NECROSIS [HSV-1]';
          bbbClass = 'text-pathology font-medium';
        } else if (pheno.id === 'tbev') {
          stemColor = '#FF3B30';
          stemOpacity = 0.72;
          cerebColor = '#FFB020';
          cerebOpacity = 0.62;
          bbbText = 'BULBAR-CEREB [TBEV]';
          bbbClass = 'text-[#FFB020] font-medium';
        } else if (pheno.id === 'nmda') {
          targetSubcortical = 1.0;
          bbbText = 'SYNAPTIC [NMDA]';
          bbbClass = 'text-normal font-medium';
        }
      } else if (currentSceneIndex === 4) {
        const t = herniation.t;
        const mCol = new THREE.Color('#34495E').lerp(new THREE.Color('#FF3B30'), t);
        targetMeningesColor = '#' + mCol.getHexString();
        targetMeningesOpacity = 0.18 + t * 0.34;

        const sCol = new THREE.Color('#3A7BD5').lerp(new THREE.Color('#FF3B30'), Math.min(1, t * 1.25));
        stemColor = '#' + sCol.getHexString();
        stemOpacity = 0.34 + t * 0.54;
        stemScaleY = 1.0 - t * 0.14;

        bbbText = herniation.pct > 35 ? `ICP ${herniation.icp} mmHg [!]` : `ICP ${herniation.icp} mmHg`;
        bbbClass = herniation.pct > 35 ? 'text-pathology font-medium' : 'text-normal font-medium';
      } else if (currentSceneIndex === 5) {
        const sim = clinicalState.scene06;
        const curCase = CLINICAL_CASES[sim.caseIndex];
        if (!sim.submitted) {
          if (sim.selectedHotspotId) {
            bbbText = `TARGET: ${sim.selectedHotspotId.toUpperCase()}`;
            bbbClass = 'text-[#FFB020] font-medium';
          } else {
            bbbText = 'SIM: AWAITING 3D TARGET';
            bbbClass = 'text-normal font-medium';
          }
        } else {
          const isAllOk =
            sim.selectedHotspotId === curCase.correctHotspotId &&
            sim.selectedDiagnosisId === curCase.correctDiagnosisId;
          bbbText = isAllOk ? 'VERIFIED [+]' : 'VERIFICATION ERR [!]';
          bbbClass = isAllOk ? 'text-normal font-medium' : 'text-pathology font-medium';
        }
      }

      const bbbLabelEl = document.getElementById('bbb-status-label');
      if (bbbLabelEl) {
        bbbLabelEl.textContent = bbbText;
        bbbLabelEl.className = bbbClass;
      }

      const targetColorObj = new THREE.Color(targetMeningesColor);
      gsap.to(meningesWireMaterial.color, {
        r: targetColorObj.r,
        g: targetColorObj.g,
        b: targetColorObj.b,
        duration: 0.45,
        ease: 'power2.out',
      });
      gsap.to(meningesWireMaterial, {
        opacity: targetMeningesOpacity,
        duration: 0.45,
        ease: 'power2.out',
      });

      gsap.to(hemispheresMaterial.uniforms.uTemporalHighlight, {
        value: targetTemporal,
        duration: 0.55,
        ease: 'power2.out',
      });
      gsap.to(hemispheresMaterial.uniforms.uSubcorticalHighlight, {
        value: targetSubcortical,
        duration: 0.55,
        ease: 'power2.out',
      });

      const stemColorObj = new THREE.Color(stemColor);
      gsap.to(brainstemWireMaterial.color, {
        r: stemColorObj.r,
        g: stemColorObj.g,
        b: stemColorObj.b,
        duration: 0.45,
      });
      gsap.to(brainstemWireMaterial, {
        opacity: stemOpacity,
        duration: 0.45,
      });
      if (brainstemGroup) {
        gsap.to(brainstemGroup.scale, {
          y: stemScaleY,
          duration: 0.4,
        });
      }

      const cerebColorObj = new THREE.Color(cerebColor);
      gsap.to(cerebellumWireMaterial.color, {
        r: cerebColorObj.r,
        g: cerebColorObj.g,
        b: cerebColorObj.b,
        duration: 0.45,
      });
      gsap.to(cerebellumWireMaterial, {
        opacity: cerebOpacity,
        duration: 0.45,
      });

      // 4. Управление видимостью и подсветкой 4 3D-хотспотов (Сцены 03, 04 и 06)
      if (hotspotsContainerGroup) {
        if (currentSceneIndex === 2) {
          hotspotsContainerGroup.visible = true;
          TOPICAL_HOTSPOTS.forEach((spot) => {
            const obj = hotspotObjectsMap[spot.id];
            if (!obj) return;
            obj.group.visible = true;
            const isSelected = spot.id === clinicalState.scene03.selectedHotspot;
            const hex = isSelected ? '#FF3B30' : '#00E5A0';
            obj.coreMesh.material.color.set(hex);
            obj.ringMesh.material.color.set(hex);
            obj.haloMesh.material.color.set(hex);
            obj.coreMesh.scale.setScalar(isSelected ? 1.35 : 0.92);
          });
        } else if (currentSceneIndex === 3) {
          hotspotsContainerGroup.visible = true;
          const pheno = CLINICAL_PHENOTYPES[clinicalState.scene04.phenotype];
          TOPICAL_HOTSPOTS.forEach((spot) => {
            const obj = hotspotObjectsMap[spot.id];
            if (!obj) return;
            const isHighlighted = pheno.activeHotspots.includes(spot.id);
            obj.group.visible = isHighlighted;
            if (isHighlighted) {
              obj.coreMesh.material.color.set(pheno.accentHex);
              obj.ringMesh.material.color.set(pheno.accentHex);
              obj.haloMesh.material.color.set(pheno.accentHex);
              obj.coreMesh.scale.setScalar(1.25);
            }
          });
        } else if (currentSceneIndex === 5) {
          hotspotsContainerGroup.visible = true;
          const sim = clinicalState.scene06;
          const curCase = CLINICAL_CASES[sim.caseIndex];
          const isAllCorrect =
            sim.submitted &&
            sim.selectedHotspotId === curCase.correctHotspotId &&
            sim.selectedDiagnosisId === curCase.correctDiagnosisId;

          TOPICAL_HOTSPOTS.forEach((spot) => {
            const obj = hotspotObjectsMap[spot.id];
            if (!obj) return;
            obj.group.visible = true;

            let hex = '#00E5A0';
            let coreScale = 0.95;

            if (!sim.submitted) {
              if (spot.id === sim.selectedHotspotId) {
                hex = '#FFB020'; // Выбранный маркер подсвечивается янтарным
                coreScale = 1.35;
              } else {
                hex = '#00E5A0'; // Все остальные — нейтральный бирюзовый
                coreScale = 0.95;
              }
            } else {
              if (spot.id === curCase.correctHotspotId) {
                hex = '#00E5A0'; // Истинный очаг — ярко-бирюзовый
                coreScale = 1.42;
              } else if (!isAllCorrect && spot.id === sim.selectedHotspotId) {
                hex = '#FF3B30'; // Ошибочно выбранный маркер — красный
                coreScale = 1.32;
              } else {
                hex = '#3A414E'; // Прочие неактивные зоны при разборе
                coreScale = 0.78;
              }
            }

            obj.coreMesh.material.color.set(hex);
            obj.ringMesh.material.color.set(hex);
            obj.haloMesh.material.color.set(hex);
            obj.coreMesh.scale.setScalar(coreScale);
          });
        } else {
          hotspotsContainerGroup.visible = false;
        }
      }
    }

    /**
     * Плавный перелёт камеры к указанному 3D-хотспоту с отключением авто-вращения
     */
    function flyCameraToHotspot(spotId) {
      const spot = TOPICAL_HOTSPOTS.find((s) => s.id === spotId);
      if (!spot) return;

      autoRotateEnabled = false;
      const autoStateEl = document.getElementById('autorotate-state');
      if (autoStateEl) {
        autoStateEl.textContent = 'OFF';
        autoStateEl.className = 'text-secondary';
      }

      brainRootGroup.updateMatrixWorld(true);
      const hotspotObj = hotspotObjectsMap[spotId];
      const worldTarget = hotspotObj
        ? hotspotObj.group.getWorldPosition(new THREE.Vector3())
        : new THREE.Vector3(spot.coords.x, spot.coords.y, spot.coords.z).applyAxisAngle(
            new THREE.Vector3(0, 1, 0),
            brainRootGroup.rotation.y
          );

      const camOffset = new THREE.Vector3(
        spot.localCamOffset.x,
        spot.localCamOffset.y,
        spot.localCamOffset.z
      ).applyAxisAngle(new THREE.Vector3(0, 1, 0), brainRootGroup.rotation.y);

      if (activeCameraTween) activeCameraTween.kill();
      if (activeTargetTween) activeTargetTween.kill();

      activeCameraTween = gsap.to(camera.position, {
        x: camOffset.x,
        y: camOffset.y,
        z: camOffset.z,
        duration: 1.15,
        ease: 'power3.out',
        onUpdate: () => controls.update(),
        onComplete: () => {
          activeCameraTween = null;
        },
      });

      activeTargetTween = gsap.to(controls.target, {
        x: worldTarget.x * 0.45,
        y: worldTarget.y * 0.65,
        z: worldTarget.z * 0.45,
        duration: 1.15,
        ease: 'power3.out',
        onComplete: () => {
          activeTargetTween = null;
        },
      });
    }

    /**
     * Выбор 3D-хотспота в Сцене 03 (по тапу в 3D или по кнопке в панели)
     */
    function selectTopicalHotspot(spotId) {
      const spot = TOPICAL_HOTSPOTS.find((s) => s.id === spotId);
      if (!spot) return;

      clinicalState.scene03.selectedHotspot = spotId;
      renderActiveScenePanel();
      sync3DAndTelemetryState();
      flyCameraToHotspot(spotId);
    }

    /**
     * Выбор 3D-хотспота в Сцене 06 (Симулятор)
     */
    function selectSimulatorHotspot(spotId) {
      if (clinicalState.scene06.submitted) return;
      const spot = TOPICAL_HOTSPOTS.find((s) => s.id === spotId);
      if (!spot) return;

      clinicalState.scene06.selectedHotspotId = spotId;
      renderActiveScenePanel();
      sync3DAndTelemetryState();
    }

    /**
     * Отрисовка живого <canvas> графика температурной кривой (Дни 1–12) для Сцены 01
     */
    function drawTempChart() {
      const canvas = document.getElementById('temp-curve-canvas');
      if (!canvas) return;

      const cssWidth = canvas.clientWidth;
      const cssHeight = canvas.clientHeight;
      if (cssWidth === 0 || cssHeight === 0) return;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const targetW = Math.round(cssWidth * dpr);
      const targetH = Math.round(cssHeight * dpr);
      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }

      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(dpr, dpr);

      const profile = ETIOLOGY_PROFILES[clinicalState.scene01.etiology];
      const strokeColor = profile.accentHex;

      ctx.fillStyle = '#090A0D';
      ctx.fillRect(0, 0, cssWidth, cssHeight);

      const padLeft = 34;
      const padRight = 10;
      const padTop = 14;
      const padBottom = 20;
      const plotW = cssWidth - padLeft - padRight;
      const plotH = cssHeight - padTop - padBottom;

      const minTemp = 36.2;
      const maxTemp = 40.3;
      const tempToY = (t) => padTop + ((maxTemp - t) / (maxTemp - minTemp)) * plotH;
      const dayToX = (idx) => padLeft + (idx / 11) * plotW;

      const refTemps = [37.0, 38.0, 39.0, 40.0];
      ctx.font = '500 9px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      refTemps.forEach((rt) => {
        const y = Math.round(tempToY(rt)) + 0.5;
        ctx.beginPath();
        if (rt === 37.0) {
          ctx.setLineDash([3, 3]);
          ctx.strokeStyle = 'rgba(0, 229, 160, 0.35)';
          ctx.fillStyle = '#00E5A0';
        } else {
          ctx.setLineDash([]);
          ctx.strokeStyle = '#22262E';
          ctx.fillStyle = '#7A8291';
        }
        ctx.lineWidth = 1;
        ctx.moveTo(padLeft, y);
        ctx.lineTo(cssWidth - padRight, y);
        ctx.stroke();

        ctx.fillText(`${rt.toFixed(0)}°`, padLeft - 5, y);
      });
      ctx.setLineDash([]);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (let i = 0; i < 12; i++) {
        const x = dayToX(i);
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(34, 38, 46, 0.55)';
        ctx.lineWidth = 1;
        ctx.moveTo(x, padTop);
        ctx.lineTo(x, padTop + plotH);
        ctx.stroke();

        if (i === 0 || i % 2 === 1 || i === 11) {
          ctx.fillStyle = '#7A8291';
          ctx.fillText(`Д${i + 1}`, x, padTop + plotH + 5);
        }
      }

      const points = [];
      for (let i = 0; i < 12; i++) {
        const tempVal = chartAnimState[`t${i}`];
        points.push({
          x: dayToX(i),
          y: tempToY(tempVal),
          val: tempVal,
        });
      }

      ctx.beginPath();
      ctx.moveTo(points[0].x, padTop + plotH);
      points.forEach((pt) => ctx.lineTo(pt.x, pt.y));
      ctx.lineTo(points[points.length - 1].x, padTop + plotH);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, padTop, 0, padTop + plotH);
      if (profile.id === 'hsv1') {
        grad.addColorStop(0, 'rgba(255, 59, 48, 0.24)');
        grad.addColorStop(1, 'rgba(255, 59, 48, 0.01)');
      } else if (profile.id === 'tbev') {
        grad.addColorStop(0, 'rgba(255, 176, 32, 0.24)');
        grad.addColorStop(1, 'rgba(255, 176, 32, 0.01)');
      } else {
        grad.addColorStop(0, 'rgba(0, 229, 160, 0.20)');
        grad.addColorStop(1, 'rgba(0, 229, 160, 0.01)');
      }
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 2;
      ctx.stroke();

      points.forEach((pt) => {
        ctx.fillStyle = '#090A0D';
        ctx.fillRect(pt.x - 2.5, pt.y - 2.5, 5, 5);
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.4;
        ctx.strokeRect(pt.x - 2.5, pt.y - 2.5, 5, 5);
      });

      ctx.font = '600 9px "JetBrains Mono", monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillStyle = strokeColor;
      ctx.fillText(profile.peakLabel, cssWidth - padRight - 2, 3);

      ctx.restore();
    }

    /**
     * Плавный переход кривой температуры при смене этиологии в Сцене 01
     */
    function animateTempCurveTo(etiologyKey) {
      const targetTemps = ETIOLOGY_PROFILES[etiologyKey].temps;
      const tweenVars = {
        duration: 0.6,
        ease: 'power2.out',
        onUpdate: drawTempChart,
      };
      targetTemps.forEach((val, idx) => {
        tweenVars[`t${idx}`] = val;
      });

      if (chartTween) chartTween.kill();
      chartTween = gsap.to(chartAnimState, tweenVars);
    }

    /**
     * Отрисовка живого <canvas> графика Триады Кушинга в реальном времени (Сцена 05)
     */
    function drawCushingChart() {
      const canvas = document.getElementById('cushing-triad-canvas');
      if (!canvas) return;

      const cssWidth = canvas.clientWidth;
      const cssHeight = canvas.clientHeight;
      if (cssWidth === 0 || cssHeight === 0) return;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const targetW = Math.round(cssWidth * dpr);
      const targetH = Math.round(cssHeight * dpr);
      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }

      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(dpr, dpr);

      const { pct, t } = getHerniationMetrics();

      ctx.fillStyle = '#090A0D';
      ctx.fillRect(0, 0, cssWidth, cssHeight);

      const padLeft = 10;
      const padRight = 10;
      const padTop = 18;
      const padBottom = 18;
      const plotW = cssWidth - padLeft - padRight;
      const plotH = cssHeight - padTop - padBottom;

      ctx.font = '500 9px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      [0, 0.25, 0.5, 0.75, 1.0].forEach((step) => {
        const x = Math.round(padLeft + step * plotW) + 0.5;
        ctx.beginPath();
        ctx.strokeStyle = step === 0.35 ? 'rgba(255, 59, 48, 0.4)' : '#22262E';
        ctx.lineWidth = 1;
        ctx.moveTo(x, padTop);
        ctx.lineTo(x, padTop + plotH);
        ctx.stroke();

        ctx.fillStyle = '#7A8291';
        ctx.fillText(`${Math.round(step * 100)}%`, x, padTop + plotH + 4);
      });

      const threshX = Math.round(padLeft + 0.35 * plotW) + 0.5;
      ctx.beginPath();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = 'rgba(255, 59, 48, 0.55)';
      ctx.moveTo(threshX, padTop);
      ctx.lineTo(threshX, padTop + plotH);
      ctx.stroke();
      ctx.setLineDash([]);

      const sbpToY = (u) => {
        const norm = (Math.pow(u, 1.15) * 95) / 105;
        return padTop + plotH - (0.08 + norm * 0.86) * plotH;
      };
      const hrToY = (u) => {
        const norm = (78 - Math.pow(u, 1.1) * 38 - 35) / 50;
        return padTop + plotH - norm * plotH;
      };
      const rrToY = (u) => {
        const norm = (16 - u * 8 - 6) / 12;
        return padTop + plotH - norm * plotH;
      };

      const drawCurve = (fnY, color, lineWidth = 1.8) => {
        ctx.beginPath();
        const steps = 40;
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const x = padLeft + u * plotW;
          const y = fnY(u);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      };

      drawCurve(sbpToY, '#FF3B30', 2.0);
      drawCurve(hrToY, '#00E5A0', 1.8);
      drawCurve(rrToY, '#FFB020', 1.8);

      const curX = padLeft + t * plotW;
      ctx.beginPath();
      ctx.strokeStyle = pct > 35 ? '#FF3B30' : '#E4E7EC';
      ctx.lineWidth = 1.2;
      ctx.moveTo(curX, padTop);
      ctx.lineTo(curX, padTop + plotH);
      ctx.stroke();

      const drawNode = (yVal, color) => {
        ctx.fillStyle = '#090A0D';
        ctx.fillRect(curX - 3, yVal - 3, 6, 6);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.6;
        ctx.strokeRect(curX - 3, yVal - 3, 6, 6);
      };
      drawNode(sbpToY(t), '#FF3B30');
      drawNode(hrToY(t), '#00E5A0');
      drawNode(rrToY(t), '#FFB020');

      ctx.font = '600 9px "JetBrains Mono", monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#FF3B30';
      ctx.fillText('■ АД СИСТ (↑)', padLeft, 3);

      ctx.fillStyle = '#00E5A0';
      ctx.fillText('■ ЧСС (↓)', padLeft + 88, 3);

      ctx.fillStyle = '#FFB020';
      ctx.fillText('■ ЧДД (↓)', padLeft + 152, 3);

      if (pct > 35) {
        ctx.textAlign = 'right';
        ctx.fillStyle = '#FF3B30';
        ctx.fillText('CN III COMPRESSION [OD↑]', cssWidth - padRight, 3);
      }

      ctx.restore();
    }

    /**
     * Быстрое обновление цифр в Сцене 05 без пересоздания DOM-узла input[type=range]
     */
    function updateScene05LiveValues() {
      const m = getHerniationMetrics();
      const isDanger = m.pct > 35;

      const pctEl = document.getElementById('edema-pct-val');
      const icpHeaderEl = document.getElementById('icp-readout');
      const bpEl = document.getElementById('vital-bp');
      const hrEl = document.getElementById('vital-hr');
      const rrEl = document.getElementById('vital-rr');
      const icpEl = document.getElementById('vital-icp');
      const noteEl = document.getElementById('herniation-note');

      if (pctEl) {
        pctEl.textContent = `${m.pct}%`;
        pctEl.className = isDanger ? 'text-pathology' : 'text-normal';
      }
      if (icpHeaderEl) {
        icpHeaderEl.textContent = `ВЧД: ${m.icp} мм рт. ст.`;
        icpHeaderEl.className = `font-semibold ${isDanger ? 'text-pathology' : 'text-[#FFB020]'}`;
      }
      if (bpEl) {
        bpEl.textContent = `${m.sbp}/${m.dbp}`;
        bpEl.className = `text-xs font-bold ${m.sbp >= 160 ? 'text-pathology' : 'text-primary'}`;
      }
      if (hrEl) {
        hrEl.textContent = `${m.hr} уд/м`;
        hrEl.className = `text-xs font-bold ${m.hr <= 55 ? 'text-pathology' : 'text-normal'}`;
      }
      if (rrEl) {
        rrEl.textContent = `${m.rr} /мин`;
        rrEl.className = `text-xs font-bold ${m.rr <= 10 ? 'text-pathology' : 'text-[#FFB020]'}`;
      }
      if (icpEl) {
        icpEl.textContent = `${m.icp} mmHg`;
        icpEl.className = `text-xs font-bold ${m.icp > 22 ? 'text-pathology' : 'text-normal'}`;
      }
      if (noteEl) {
        noteEl.className = `border border-[#22262E] bg-[#090A0D]/80 px-2.5 py-2 rounded-[2px] font-mono text-[10px] sm:text-[11px] leading-snug ${
          isDanger ? 'text-pathology border-pathology/50' : 'text-secondary'
        }`;
        noteEl.textContent = isDanger
          ? 'ВИСОЧНО-ТЕНТОРИАЛЬНОЕ ВКЛИНЕНИЕ: крючок гиппокампа ущемляется в вырезке намёта мозжечка, сдавливая III пару ЧМН (анизокория OD > OS) и средний мозг с развитием рефлекса Кушинга.'
