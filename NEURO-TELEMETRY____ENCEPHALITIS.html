    }

    /**
     * Рендер содержимого Сцены [06 СИМУЛЯТОР] (Клинические задачи с 3D-верификацией очага)
     */
    function renderScene06Content(container) {
      const sim = clinicalState.scene06;
      const curCase = CLINICAL_CASES[sim.caseIndex];
      const selectedSpot = TOPICAL_HOTSPOTS.find((s) => s.id === sim.selectedHotspotId);
      const correctSpot = TOPICAL_HOTSPOTS.find((s) => s.id === curCase.correctHotspotId);
      const correctDiag = SIMULATOR_DIAGNOSES.find((d) => d.id === curCase.correctDiagnosisId);

      const isHotspotCorrect = sim.selectedHotspotId === curCase.correctHotspotId;
      const isDiagnosisCorrect = sim.selectedDiagnosisId === curCase.correctDiagnosisId;
      const isBothCorrect = sim.submitted && isHotspotCorrect && isDiagnosisCorrect;

      // Текст индикатора выбранного 3D-очага
      let selectedSpotIndicatorHtml = '';
      if (!sim.submitted) {
        if (selectedSpot) {
          selectedSpotIndicatorHtml = `<span class="text-[#FFB020] font-semibold">[${selectedSpot.shortLabel.toUpperCase()}]</span>`;
        } else {
          selectedSpotIndicatorHtml = `<span class="text-secondary">[нажмите на зону в 3D-мозге]</span>`;
        }
      } else {
        if (isHotspotCorrect) {
          selectedSpotIndicatorHtml = `<span class="text-normal font-semibold">[${selectedSpot.shortLabel.toUpperCase()} — ВЕРНО]</span>`;
        } else {
          selectedSpotIndicatorHtml = `<span class="text-pathology font-semibold">[${selectedSpot ? selectedSpot.shortLabel.toUpperCase() : '—'} — ОШИБКА]</span>`;
        }
      }

      // 4 компактные кнопки выбора 3D-зоны (дублирование для удобства на смартфоне)
      const zoneButtonsHtml = TOPICAL_HOTSPOTS.map((spot) => {
        const isSelected = spot.id === sim.selectedHotspotId;
        let btnCls = 'border-[#22262E] text-primary bg-[#090A0D] hover:border-[#3E4554]';
        let dotCls = 'bg-normal';

        if (!sim.submitted) {
          if (isSelected) {
            btnCls = 'border-[#FFB020] text-[#FFB020] bg-[#FFB020]/15 font-semibold';
            dotCls = 'bg-[#FFB020]';
          }
        } else {
          if (spot.id === curCase.correctHotspotId) {
            btnCls = 'border-normal text-normal bg-normal/15 font-semibold';
            dotCls = 'bg-normal';
          } else if (isSelected && spot.id !== curCase.correctHotspotId) {
            btnCls = 'border-pathology text-pathology bg-pathology/15 font-semibold';
            dotCls = 'bg-pathology';
          } else {
            btnCls = 'border-[#22262E] text-secondary bg-[#090A0D] opacity-60';
            dotCls = 'bg-[#3A414E]';
          }
        }

        return `
          <button
            type="button"
            data-sim-hotspot="${spot.id}"
            ${sim.submitted ? 'disabled' : ''}
            class="sim-hotspot-btn min-h-[32px] border px-2 py-1 font-mono text-[10px] rounded-[2px] transition-colors flex items-center justify-between gap-1 text-left ${btnCls}"
          >
            <span class="truncate">${spot.shortLabel}</span>
            <span class="inline-block h-1.5 w-1.5 rounded-[1px] shrink-0 ${dotCls}"></span>
          </button>
        `;
      }).join('');

      // 4 кнопки выбора нозологии (Шаг 2)
      const diagnosisButtonsHtml = SIMULATOR_DIAGNOSES.map((diag) => {
        const isSelected = diag.id === sim.selectedDiagnosisId;
        let btnCls = 'border-[#22262E] text-primary bg-[#090A0D] hover:border-[#3E4554]';

        if (!sim.submitted) {
          if (isSelected) {
            btnCls = 'border-[#FFB020] text-[#FFB020] bg-[#FFB020]/15 font-semibold';
          }
        } else {
          if (diag.id === curCase.correctDiagnosisId) {
            btnCls = 'border-normal text-normal bg-normal/15 font-semibold';
          } else if (isSelected && diag.id !== curCase.correctDiagnosisId) {
            btnCls = 'border-pathology text-pathology bg-pathology/15 font-semibold';
          } else {
            btnCls = 'border-[#22262E] text-secondary bg-[#090A0D] opacity-60';
          }
        }

        return `
          <button
            type="button"
            data-sim-diag="${diag.id}"
            ${sim.submitted ? 'disabled' : ''}
            class="sim-diag-btn min-h-[34px] border px-2 py-1.5 font-mono text-[10px] sm:text-[11px] rounded-[2px] transition-colors text-center truncate ${btnCls}"
          >
            [${diag.buttonLabel}]
          </button>
        `;
      }).join('');

      const canConfirm = Boolean(sim.selectedHotspotId && sim.selectedDiagnosisId && !sim.submitted);

      // Блок действия или результата верификации
      let footerActionHtml = '';
      if (!sim.submitted) {
        footerActionHtml = `
          <button
            id="btn-sim-confirm"
            type="button"
            ${canConfirm ? '' : 'disabled'}
            class="min-h-[38px] w-full border px-3 py-2 font-mono text-[11px] font-bold tracking-[0.05em] rounded-[2px] transition-colors ${
              canConfirm
                ? 'border-normal bg-normal/15 text-normal hover:bg-normal/25 cursor-pointer'
                : 'border-[#22262E] bg-[#090A0D] text-secondary opacity-55 cursor-not-allowed'
            }"
          >
            [ПОДТВЕРДИТЬ ДИАГНОЗ]
          </button>
        `;
      } else {
        const resultBannerHtml = isBothCorrect
          ? `
            <div class="border border-normal bg-normal/15 px-2.5 py-2 rounded-[2px] flex flex-col gap-1.5">
              <div class="flex items-center justify-between font-mono text-[11px] font-bold text-normal">
                <span>[ДИАГНОЗ ВЕРЕН]</span>
                <span>3D + НОЗОЛОГИЯ: OK</span>
              </div>
              <p class="text-[11px] leading-snug text-primary">
                ${curCase.breakdown}
              </p>
            </div>
          `
          : `
            <div class="border border-pathology bg-pathology/15 px-2.5 py-2 rounded-[2px] flex flex-col gap-1.5">
              <div class="flex items-center justify-between font-mono text-[11px] font-bold text-pathology">
                <span>[ОШИБКА ВЕРИФИКАЦИИ]</span>
                <span>СМОТРИТЕ ИСТИННЫЙ ОЧАГ В 3D</span>
              </div>
              <div class="font-mono text-[10px] sm:text-[11px] text-normal font-semibold">
                ПРАВИЛЬНАЯ ПАРА: ${correctSpot.shortLabel} + ${correctDiag.fullLabel}
              </div>
              <p class="text-[11px] leading-snug text-primary">
                ${curCase.breakdown}
              </p>
            </div>
          `;

        footerActionHtml = `
          <div class="flex flex-col gap-2">
            ${resultBannerHtml}
            <button
              id="btn-sim-next"
              type="button"
              class="min-h-[38px] w-full border border-primary bg-[#090A0D] px-3 py-2 font-mono text-[11px] font-bold tracking-[0.05em] text-primary hover:border-normal hover:text-normal transition-colors rounded-[2px]"
            >
              [СЛЕДУЮЩИЙ ПАЦИЕНТ →]
            </button>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="flex flex-col gap-2.5">
          <!-- Шапка кейса и счётчик прогресса -->
          <div class="flex items-center justify-between border border-[#22262E] bg-[#090A0D] px-2.5 py-1.5 rounded-[2px] font-mono text-[11px]">
            <span class="font-bold text-primary">КЕЙС #${curCase.number} / 04</span>
            <span class="font-bold text-normal">РЕШЕНО: ${sim.solvedIds.length} / 4</span>
          </div>

          <!-- Карточка пациента -->
          <div class="border border-[#22262E] bg-[#090A0D]/80 p-2.5 rounded-[2px] flex flex-col gap-1.5">
            <div class="font-mono text-[10px] sm:text-[11px] font-semibold text-[#FFB020] leading-snug">
              ${curCase.patient}
            </div>
            <p class="text-[11px] leading-snug text-primary border-t border-[#22262E]/80 pt-1.5">
              ${curCase.status}
            </p>
          </div>

          <!-- ШАГ 1 — ТОПИКА В 3D -->
          <div class="border border-[#22262E] bg-[#090A0D]/80 p-2.5 rounded-[2px] flex flex-col gap-1.5">
            <div class="flex flex-wrap items-center justify-between gap-1 font-mono text-[10px]">
              <span class="font-semibold text-secondary">ШАГ 1 — ТОПИКА В 3D:</span>
              <span>ВЫБРАННЫЙ ОЧАГ В 3D: ${selectedSpotIndicatorHtml}</span>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
              ${zoneButtonsHtml}
            </div>
          </div>

          <!-- ШАГ 2 — НОЗОЛОГИЯ -->
          <div class="border border-[#22262E] bg-[#090A0D]/80 p-2.5 rounded-[2px] flex flex-col gap-1.5">
            <div class="font-mono text-[10px] font-semibold text-secondary">
              ШАГ 2 — НОЗОЛОГИЯ (ВЫБЕРИТЕ ДИАГНОЗ):
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
              ${diagnosisButtonsHtml}
            </div>
          </div>

          <!-- Кнопка подтверждения или разбор результата -->
          ${footerActionHtml}
        </div>
      `;

      // Обработчики кнопок выбора 3D-зоны
      container.querySelectorAll('.sim-hotspot-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const spotId = btn.getAttribute('data-sim-hotspot');
          if (spotId) selectSimulatorHotspot(spotId);
        });
      });

      // Обработчики кнопок выбора диагноза
      container.querySelectorAll('.sim-diag-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (clinicalState.scene06.submitted) return;
          const diagId = btn.getAttribute('data-sim-diag');
          if (!diagId) return;
          clinicalState.scene06.selectedDiagnosisId = diagId;
          renderScene06Content(container);
        });
      });

      // Обработчик подтверждения диагноза
      const confirmBtn = document.getElementById('btn-sim-confirm');
      if (confirmBtn) {
        confirmBtn.addEventListener('click', () => {
          const s = clinicalState.scene06;
          if (!s.selectedHotspotId || !s.selectedDiagnosisId || s.submitted) return;

          s.submitted = true;
          const activeCase = CLINICAL_CASES[s.caseIndex];
          const isAllOk =
            s.selectedHotspotId === activeCase.correctHotspotId &&
            s.selectedDiagnosisId === activeCase.correctDiagnosisId;

          if (isAllOk) {
            if (!s.solvedIds.includes(activeCase.id)) {
              s.solvedIds.push(activeCase.id);
            }
          } else {
            // При ошибке плавно перелетаем камерой к истинному 3D-очагу
            flyCameraToHotspot(activeCase.correctHotspotId);
          }

          renderScene06Content(container);
          sync3DAndTelemetryState();
        });
      }

      // Обработчик перехода к следующему пациенту
      const nextBtn = document.getElementById('btn-sim-next');
      if (nextBtn) {
        nextBtn.addEventListener('click', () => {
          const s = clinicalState.scene06;
          s.caseIndex = (s.caseIndex + 1) % CLINICAL_CASES.length;
          s.selectedHotspotId = null;
          s.selectedDiagnosisId = null;
          s.submitted = false;

          renderScene06Content(container);
          sync3DAndTelemetryState();
        });
      }
    }

    /**
     * Отрисовка актуального контента внутри #scene-panel-body
     */
    function renderActiveScenePanel() {
      const bodyEl = document.getElementById('scene-panel-body');
      if (!bodyEl) return;

      if (clinicalState.panelCollapsed) {
        bodyEl.classList.add('hidden');
        return;
      }
      bodyEl.classList.remove('hidden');

      if (currentSceneIndex === 0) {
        renderScene01Content(bodyEl);
      } else if (currentSceneIndex === 1) {
        renderScene02Content(bodyEl);
      } else if (currentSceneIndex === 2) {
        renderScene03Content(bodyEl);
      } else if (currentSceneIndex === 3) {
        renderScene04Content(bodyEl);
      } else if (currentSceneIndex === 4) {
        renderScene05Content(bodyEl);
      } else if (currentSceneIndex === 5) {
        renderScene06Content(bodyEl);
      }
    }

    /**
     * Переключение на одну из 6 сцен с плавным перелётом камеры через GSAP
     */
    function selectScene(index) {
      const cfg = SCENES_CONFIG[index];
      if (!cfg) return;
      currentSceneIndex = index;

      // 1. Обновляем активное состояние кнопок навигации
      const buttons = document.querySelectorAll('.scene-btn');
      buttons.forEach((btn, idx) => {
        const indicatorDot = btn.querySelector('span:last-child');
        if (idx === index) {
          const isAlert = cfg.severity === 'ALERT';
          btn.classList.remove('text-primary', 'border-[#22262E]');
          btn.classList.add(
            isAlert ? 'border-pathology' : 'border-normal',
            isAlert ? 'text-pathology' : 'text-normal',
            isAlert ? 'bg-pathology/10' : 'bg-normal/10'
          );
          if (indicatorDot) {
            indicatorDot.className = `inline-block h-1.5 w-1.5 rounded-[1px] shrink-0 ml-1 ${
              isAlert ? 'bg-pathology' : 'bg-normal'
            }`;
          }
        } else {
          btn.className =
            'scene-btn brutal-panel min-h-[42px] px-2.5 py-2 text-left font-mono text-[11px] font-medium tracking-[0.03em] text-primary hover:border-[#3E4554] transition-colors flex items-center justify-between';
          if (indicatorDot) {
            indicatorDot.className = 'inline-block h-1.5 w-1.5 bg-[#22262E] rounded-[1px] shrink-0 ml-1';
          }
        }
      });

      // 2. Обновляем шапку информационной панели
      const isAlert = cfg.severity === 'ALERT';
      const badgeEl = document.getElementById('scene-code-badge');
      const titleEl = document.getElementById('scene-title');
      const vectorEl = document.getElementById('scene-vector-tag');

      badgeEl.textContent = cfg.code;
      badgeEl.className = isAlert
        ? 'font-mono text-[11px] font-bold px-1.5 py-0.5 bg-pathology/15 text-pathology border border-pathology/50 rounded-[2px]'
        : 'font-mono text-[11px] font-bold px-1.5 py-0.5 bg-normal/10 text-normal border border-normal/40 rounded-[2px]';

      titleEl.textContent = cfg.title;
      vectorEl.textContent = cfg.vector;

      // 3. Рендерим динамическое содержимое сцены и синхронизируем 3D-материалы
      renderActiveScenePanel();
      sync3DAndTelemetryState();

      // 4. Плавный перелёт камеры и точки фокуса через GSAP
      if (activeCameraTween) activeCameraTween.kill();
      if (activeTargetTween) activeTargetTween.kill();

      activeCameraTween = gsap.to(camera.position, {
        x: cfg.cameraPos.x,
        y: cfg.cameraPos.y,
        z: cfg.cameraPos.z,
        duration: 1.35,
        ease: 'power3.inOut',
        onUpdate: () => {
          controls.update();
        },
        onComplete: () => {
          activeCameraTween = null;
        },
      });

      activeTargetTween = gsap.to(controls.target, {
        x: cfg.targetPos.x,
        y: cfg.targetPos.y,
        z: cfg.targetPos.z,
        duration: 1.35,
        ease: 'power3.inOut',
        onComplete: () => {
          activeTargetTween = null;
        },
      });
    }

    /**
     * Инициализация событий интерфейса
     */
    function initHUD() {
      document.querySelectorAll('.scene-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-scene'));
          selectScene(idx);
        });
      });

      const togglePanelBtn = document.getElementById('btn-toggle-panel');
      togglePanelBtn.addEventListener('click', () => {
        clinicalState.panelCollapsed = !clinicalState.panelCollapsed;
        togglePanelBtn.textContent = clinicalState.panelCollapsed ? '[+]' : '[–]';
        togglePanelBtn.setAttribute('aria-expanded', String(!clinicalState.panelCollapsed));
        renderActiveScenePanel();
      });

      const autoBtn = document.getElementById('btn-autorotate');
      const autoStateEl = document.getElementById('autorotate-state');
      autoBtn.addEventListener('click', () => {
        autoRotateEnabled = !autoRotateEnabled;
        autoStateEl.textContent = autoRotateEnabled ? 'ON' : 'OFF';
        autoStateEl.className = autoRotateEnabled ? 'text-normal' : 'text-secondary';
      });

      const resetBtn = document.getElementById('btn-reset-view');
      resetBtn.addEventListener('click', () => {
        selectScene(currentSceneIndex);
      });

      renderActiveScenePanel();
      sync3DAndTelemetryState();
    }

    /**
     * Обновление живых показаний пупиллометрии (OD / OS)
     */
    let lastHudUpdate = 0;
    const odValEl = document.getElementById('od-val');
    const osValEl = document.getElementById('os-val');
    const odSvgEl = document.getElementById('pupil-od-svg');
    const osSvgEl = document.getElementById('pupil-os-svg');
    const camAnglesEl = document.getElementById('camera-angles');

    function updateLiveTelemetry(elapsed) {
      if (elapsed - lastHudUpdate < 0.2) return;
      lastHudUpdate = elapsed;

      const gcsTotal =
        clinicalState.scene02.e + clinicalState.scene02.v + clinicalState.scene02.m;
      const edemaPct = clinicalState.scene05.edemaIndex;
      const microOsc = Math.sin(elapsed * 1.4) * 0.04;

      let odMmNum = 3.0;
      let osMmNum = 3.0;
      let odColorHex = '#00E5A0';
      let osColorHex = '#00E5A0';
      let odTextClass = 'text-normal';
      let osTextClass = 'text-normal';

      if (currentSceneIndex === 4 && edemaPct > 35) {
        const progress = (edemaPct - 35) / 65;
        odMmNum = 3.1 + progress * 3.7 + microOsc * 0.5;
        osMmNum = 3.1 - microOsc * 0.4;
        odColorHex = '#FF3B30';
        odTextClass = 'text-pathology';
        osColorHex = '#00E5A0';
        osTextClass = 'text-normal';
      } else if (currentSceneIndex === 2 && clinicalState.scene03.selectedHotspot === 'brainstem') {
        odMmNum = 4.2 + microOsc * 0.4;
        osMmNum = 3.0 - microOsc * 0.4;
        odColorHex = '#FFB020';
        odTextClass = 'text-[#FFB020]';
        osColorHex = '#00E5A0';
        osTextClass = 'text-normal';
      } else {
        const gcsDilation = gcsTotal < 13 ? ((13 - gcsTotal) / 10) * 1.8 : 0.0;
        odMmNum = 3.0 + gcsDilation + microOsc;
        osMmNum = 3.0 + gcsDilation - microOsc * 0.5;

        if (gcsTotal <= 8) {
          odColorHex = osColorHex = '#FF3B30';
          odTextClass = osTextClass = 'text-pathology';
        } else if (gcsTotal < 13) {
          odColorHex = osColorHex = '#FFB020';
          odTextClass = osTextClass = 'text-[#FFB020]';
        }
      }

      odValEl.textContent = odMmNum.toFixed(1);
      osValEl.textContent = osMmNum.toFixed(1);
      odValEl.className = odTextClass;
      osValEl.className = osTextClass;

      odSvgEl.setAttribute('fill', odColorHex);
      osSvgEl.setAttribute('fill', osColorHex);

      const odSvgR = THREE.MathUtils.clamp(2.7 + (odMmNum - 3.0) * 0.65, 2.2, 5.4);
      const osSvgR = THREE.MathUtils.clamp(2.7 + (osMmNum - 3.0) * 0.65, 2.2, 5.4);
      odSvgEl.setAttribute('r', odSvgR.toFixed(2));
      osSvgEl.setAttribute('r', osSvgR.toFixed(2));

      if (camAnglesEl && camera && controls) {
        const offset = new THREE.Vector3().subVectors(camera.position, controls.target);
        const spherical = new THREE.Spherical().setFromVector3(offset);
        const azDeg = Math.round(THREE.MathUtils.radToDeg(spherical.theta));
        const elDeg = Math.round(90 - THREE.MathUtils.radToDeg(spherical.phi));
        const azStr = (azDeg >= 0 ? '+' : '-') + String(Math.abs(azDeg)).padStart(3, '0');
        const elStr = (elDeg >= 0 ? '+' : '-') + String(Math.abs(elDeg)).padStart(3, '0');
        camAnglesEl.textContent = `AZ: ${azStr}° EL: ${elStr}°`;
      }
    }

    /**
     * Главный цикл рендеринга
     */
    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      if (hemispheresMaterial) {
        hemispheresMaterial.uniforms.uTime.value = elapsed;
      }

      // Пульсация и поворот колец 3D-хотспотов к камере
      if (hotspotsContainerGroup && hotspotsContainerGroup.visible) {
        TOPICAL_HOTSPOTS.forEach((spot, idx) => {
          const obj = hotspotObjectsMap[spot.id];
          if (!obj || !obj.group.visible) return;

          obj.ringMesh.lookAt(camera.position);
          obj.haloMesh.lookAt(camera.position);

          const pulse = 1.0 + 0.16 * Math.sin(elapsed * 4.2 + idx * 1.4);
          obj.ringMesh.scale.setScalar(pulse);
          obj.haloMesh.scale.setScalar(1.0 + 0.28 * Math.sin(elapsed * 3.1 + idx));
        });
      }

      if (autoRotateEnabled && !activeCameraTween && brainRootGroup) {
        brainRootGroup.rotation.y += 0.0018;
      }

      controls.update();
      updateLiveTelemetry(elapsed);
      renderer.render(scene, camera);
    }

    // Запуск приложения после полной загрузки окна
    window.addEventListener('load', () => {
      try {
        initThree();
        initHUD();
        animate();
      } catch (err) {
        console.error('Ошибка инициализации 3D-терминала:', err);
        const statusText = document.getElementById('system-status-text');
        const statusDot = document.getElementById('status-dot');
        if (statusText) {
          statusText.textContent = 'WEBGL ERROR';
          statusText.classList.remove('text-normal');
          statusText.classList.add('text-pathology');
        }
        if (statusDot) {
          statusDot.classList.remove('bg-normal');
          statusDot.classList.add('bg-pathology');
        }
      }
    });
  </script>
</body>
