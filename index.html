<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Медицинские 3D-презентации — Азамат</title>
  <style>
    :root {
      --bg: #050811;
      --card: rgba(15, 23, 42, 0.75);
      --border: rgba(56, 189, 248, 0.25);
      --cyan: #38bdf8;
      --rose: #fb7185;
      --amber: #fbbf24;
      --purple: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #0f172a, var(--bg) 65%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 820px; }
    header {
      margin-bottom: 36px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 24px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 12px;
      border-radius: 99px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .subtitle { color: #94a3b8; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    a.card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    a.card:hover {
      transform: translateY(-4px);
      border-color: var(--cyan);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.18);
    }
    .tag {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      color: var(--cyan);
    }
    .tag.rose { color: var(--rose); }
    .tag.amber { color: var(--amber); }
    .tag.purple { color: var(--purple); }
    h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
    p { font-size: 0.88rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 18px; }
    .btn { font-size: 13px; font-weight: 600; color: var(--cyan); display: flex; align-items: center; gap: 6px; }
    .status { color: #94a3b8; font-size: 0.95rem; padding: 20px 0; }
    footer { margin-top: 48px; text-align: center; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">Atyrau Medical College</div>
      <h1>Интерактивные презентации</h1>
      <div class="subtitle">WebGL / 3D визуализации и клинические разборы · by Azamat</div>
    </header>

    <div class="grid" id="grid">
      <div class="status">Загрузка списка презентаций...</div>
    </div>

    <footer>
      Автоматический каталог презентаций · GitHub Pages
    </footer>
  </div>

  <script>
    const USER = 'drownedineyes';
    const REPO = 'med';

    // Красивые названия и описания для уже загруженных файлов
    const META = {
      'cyber_optics_astigmatism_presentation-v3.html': {
        tag: 'Офтальмология · 3D WebGL',
        color: '',
        title: 'Астигматизм: Cyber-Optics 3D (v3)',
        desc: 'Анатомическая 3D-модель глаза, коноид Штурма, кератотопография и симуляция зрения пациента.'
      },
      'astigmatism-v2.html': {
        tag: 'Офтальмология · Версия 2',
        color: 'amber',
        title: 'Астигматизм (v2)',
        desc: 'Альтернативная интерактивная версия визуализации рефракции и торической коррекции.'
      },
      'tuberculosis.html': {
        tag: 'Фтизиатрия',
        color: 'rose',
        title: 'Туберкулез',
        desc: 'Интерактивный разбор патогенеза, диагностики и клинических форм туберкулеза.'
      },
      'bronchitis-diagnostics.html': {
        tag: 'Пульмонология',
        color: '',
        title: 'Диагностика бронхита',
        desc: 'Клиническая картина, дифференциальная диагностика и тактика ведения пациентов.'
      },
      'CORTEX — The Architecture of Reality.html': {
        tag: 'Психиатрия и нейробиология',
        color: 'purple',
        title: 'CORTEX: Архитектура реальности',
        desc: '3D-модель мозга, дофаминовые пути, синапсы и нейробиология шизофрении.'
      }
    };

    function formatTitle(filename) {
      return filename
        .replace(/\.html$/i, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\b\w/g, l => l.toUpperCase());
    }

    async function loadPresentations() {
      const grid = document.getElementById('grid');
      try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
        if (!res.ok) throw new Error('API limit');
        const files = await res.json();

        const htmlFiles = files.filter(f =>
          f.type === 'file' &&
          f.name.toLowerCase().endsWith('.html') &&
          f.name.toLowerCase() !== 'index.html'
        );

        if (!htmlFiles.length) {
          grid.innerHTML = '<div class="status">HTML-презентации пока не загружены.</div>';
          return;
        }

        grid.innerHTML = htmlFiles.map(file => {
          const info = META[file.name] || {
            tag: 'Медицинская презентация',
            color: '',
            title: formatTitle(file.name),
            desc: 'Интерактивная веб-презентация из репозитория.'
          };
          const href = encodeURI(file.name);
          return `
            <a class="card" href="${href}">
              <div>
                <div class="tag ${info.color}">${info.tag}</div>
                <h2>${info.title}</h2>
                <p>${info.desc}</p>
              </div>
              <div class="btn">Открыть презентацию →</div>
            </a>
          `;
        }).join('');
      } catch (e) {
        // Резервный вывод из META, если GitHub API временно недоступен
        grid.innerHTML = Object.entries(META).map(([name, info]) => `
          <a class="card" href="${encodeURI(name)}">
            <div>
              <div class="tag ${info.color}">${info.tag}</div>
              <h2>${info.title}</h2>
              <p>${info.desc}</p>
            </div>
            <div class="btn">Открыть презентацию →</div>
          </a>
        `).join('');
      }
    }

    loadPresentations();
  </script>
</body>
</html>
